services:
  sourcetube:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8787}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}
      INVIDIOUS_INSTANCE: ${INVIDIOUS_INSTANCE:-https://yt.chocolatemoo53.com}
      SOURCETUBE_PUBLIC: /usr/share/sourcetube/public
      SOURCETUBE_PLAYER: /usr/local/bin/sourcetube-player
    restart: unless-stopped
